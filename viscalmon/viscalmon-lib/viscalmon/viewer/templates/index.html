<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Radar viewer</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.19.5/proj4.js" integrity="sha512-4yY4oj6XfefW6wLk/H4T7SG1DmIdDsKZ3p/bm8Vpy7L0RWjRtOZ3v2NKcJ554AoOtODUrzb0qcIF22wdIEP2pg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<script src="https://cdn.jsdelivr.net/npm/ol@v10.6.0/dist/ol.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.0/ol.css">
		<script src="https://unpkg.com/ol-mapbox-style@12.1.1/dist/olms.js"></script>

		<style>
			.date:hover {
				text-decoration: underline;
				opacity: 0.6;
				cursor: pointer;
			}

			.form-range {
				max-width: 100px;
			}

			ul {
				list-style-type: none;
			}

			.caret {
				cursor: pointer;
				-webkit-user-select: none; /* Safari 3.1+ */
				-moz-user-select: none; /* Firefox 2+ */
				-ms-user-select: none; /* IE 10+ */
				user-select: none;
			}

			.caret::before {
				content: "\25B6";
				color: black;
				display: inline-block;
				margin-right: 6px;
			}

			.caret-down::before {
				-ms-transform: rotate(90deg); /* IE 9 */
				-webkit-transform: rotate(90deg); /* Safari */
				transform: rotate(90deg);
			}

			.nested {
				display: none;
			}

			.active {
				display: block;
			}

			td {
				vertical-align: middle;
			}
			.label-group {
				color: rgba(var(--bs-body-color-rgb),.65);
				transform : scale(.85)
			}

			img {
				image-rendering: pixelated;
			}
		</style>

	</head>
	<body>
		<div class="vh-100 vw-100 d-flex flex-column p-5">
			<div class="w-100 d-flex flex-row align-items-center flex-wrap mb-4">
				<h2 class="me-5">Radar viewer</h2>
				<div>
					<a href="/ppi" class="link-secondary me-5">PPI</a>
					<a href="/azi-dist" class="link-secondary">Azimut-distance</a>
				</div>
			</div>
			<div class="w-100 d-flex flex-row align-items-center flex-wrap">
				<div class="flex-grow-1 d-flex flex-row align-items-center mb-4">
					<div class="form-floating flex-grow-1">
						<select class="form-select w-100" id="select-interval">
						</select>
						<label for="select-interval">Interval</label>
					</div>
					<div class="form-floating flex-grow-1 ms-5">
						<select class="form-select w-100" id="select-radar">
						</select>
						<label for="select-radar">Radar</label>
					</div>
					<div class="form-floating flex-grow-1 ms-5">
						<select class="form-select w-100" id="select-moment">
						</select>
						<label for="select-moment">Moment</label>
					</div>
					<div class="form-floating flex-grow-1 ms-5">
						<select class="form-select w-100" id="select-elevation">
						</select>
						<label for="select-elevation">Elevation</label>
					</div>
					<button type="button" class="btn btn-secondary ms-5" data-bs-toggle="modal" data-bs-target="#modal-images-management">Images management</button>
				</div>
			</div>
			<div class="d-flex flex-row align-items-start mx-0 justify-content-between flex-grow-1 overflow-hidden">
				<div class="h-100 ps-0 me-3 overflow-y-scroll pe-3">
					<h3>Legend</h3>
					<div id="legend"></div>
					{% block opacity_html %}{% endblock %}
				</div>
				{% block central_block %}{% endblock %}
				<div class="h-100 ps-5 pe-0 d-flex flex-column">
					<h3>Dates</h3>
					<div id="dates" class="overflow-y-scroll pe-3">
					</div>
				</div>
			</div>
		</div>

		<div class="modal fade" id="modal-images-management" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg modal-fullscreen-lg-down">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5">Images management</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body" id="modal-images-management-body">
						<div class="alert alert-danger w-100" role="alert" id="dir-size-display"></div>
						Coming soon...
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-danger" id="images-management-delete">Delete</button>
						<button type="button" class="btn btn-success" data-bs-target="#modal-images-add" data-bs-toggle="modal" id="images-management-add">Add</button>
					</div>
				</div>
			</div>
		</div>

		<div class="modal fade" id="modal-images-add" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg modal-fullscreen-lg-down">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5">Add images</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="border border-1 rounded p-2">
							<label class="label-group">Radars</label>
							<div class="d-flex flex-row justify-content-around mt-2 flex-wrap">
								<div class="form-check form-switch">
									<input class="form-check-input" type="checkbox" role="switch" id="select-jabbeke">
									<label class="form-check-label" for="select-jabbeke">Jabbeke</label>
								</div>
								<div class="form-check form-switch">
									<input class="form-check-input" type="checkbox" role="switch" id="select-wideumont">
									<label class="form-check-label" for="select-wideumont">Wideumont</label>
								</div>
							</div>
						</div>
						<div class="form-floating mt-3">
							<input type="datetime-local" id="select-start-date-add-images" class="form-control"/>
							<label for="select-start-date-add-images">Start date (UTC)</label>
						</div>
						<div class="form-floating mt-3">
							<input type="datetime-local" id="select-end-date-add-images" class="form-control"/>
							<label for="select-end-date-add-images">End date (UTC)</label>
						</div>
						<div class="d-flex flex-row justify-content-between mt-3 flex-wrap">
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-dbz">
								<label class="form-check-label" for="select-dbz">dBZ</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-dbuz">
								<label class="form-check-label" for="select-dbuz">dBuZ</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-zdr">
								<label class="form-check-label" for="select-zdr">ZDR</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-rhohv">
								<label class="form-check-label" for="select-rhohv">RhoHV</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-phidp">
								<label class="form-check-label" for="select-phidp">PhiDP</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-uphidp">
								<label class="form-check-label" for="select-uphidp">uPhiDP</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-kdp">
								<label class="form-check-label" for="select-kdp">KDP</label>
							</div>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="select-v">
								<label class="form-check-label" for="select-v">V</label>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" id="images-management-add-confirm">
							 <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner-confirm-add"></span>
							 <span>Confirm</span>
						</button>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
	
		<script>
			let infos = {};
			let colormaps = {{colormaps | tojson}};
			
			{% block map_creation %}{% endblock %}

			document.getElementById("select-interval").addEventListener(
				"input",
				() => {
					Papa.parse(`/static/{{static_folder}}${document.getElementById("select-interval").value}/info.csv`, {
						download: true,
						complete: (results) => {
							infos = {};

							for (const row of results.data.slice(1)) {
								if (row.length < 2) {
									continue;
								}
								const [radar, moment, datetime, elevation, filename, range] = row;

								if (!infos[radar]) infos[radar] = {};
								if (!infos[radar][moment]) infos[radar][moment] = {};
								if (!infos[radar][moment][elevation]) infos[radar][moment][elevation] = {};

								infos[radar][moment][elevation][datetime] = {"file":filename, "range":range};
							}

							document.getElementById("select-radar").replaceChildren();
							for (const radar of Object.keys(infos)) {
								document.getElementById("select-radar").add(new Option(radar));
							}
							document.getElementById("select-radar").dispatchEvent(new InputEvent("input"));
						}
					});
				}
			);

			{% block after_radar_selection %}{% endblock %}
			
			document.getElementById("select-moment").addEventListener(
				"input",
				() => {
					let radar = document.getElementById("select-radar").value;
					let moment = document.getElementById("select-moment").value;
					let oldElevation = document.getElementById("select-elevation").value;
					
					document.getElementById("select-elevation").replaceChildren();
					let indexToSelect = undefined;
					for (const [i, elevation] of Object.keys(infos[radar][moment]).entries()) {
						document.getElementById("select-elevation").add(new Option(elevation));
						if (elevation === oldElevation) {
							indexToSelect = i;
						}
					}
					document.getElementById("select-elevation").selectedIndex = indexToSelect ? indexToSelect : 0;

					document.getElementById("select-elevation").dispatchEvent(new InputEvent("input"));

					document.getElementById("legend").replaceChildren();
					for (const range of colormaps[moment].toReversed()) {
						let entry = document.createElement("div")
						entry.className = "d-flex flex-row align-items-center";

						if (range["bounds"] !== "missing") {
							let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
							svg.setAttribute("width", "16");
							svg.setAttribute("height", "16");
							svg.setAttribute("fill", `rgba(${range['color'][0]}, ${range['color'][1]}, ${range['color'][2]}, ${range['color'][3]})`);
							svg.setAttribute("stroke", "#000000");
							svg.setAttribute("class", "bi bi-square-fill me-3 flex-shrink-0");
							svg.setAttribute("viewBox", "0 0 16 16");
							
							let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
							path.setAttribute("d", "M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z");
							svg.appendChild(path);

							entry.appendChild(svg);

							let spanBounds = document.createElement("span");
							spanBounds.innerHTML = range.hasOwnProperty("comment") ? range["comment"] : `]&nbsp;${range["bounds"][0]}&nbsp;;&nbsp;${range["bounds"][1]}&nbsp;]`;
							entry.appendChild(spanBounds);
						} else {
							let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
							svg.setAttribute("width", "16");
							svg.setAttribute("height", "16");
							svg.setAttribute("class", "bi bi-x-square me-3 flex-shrink-0");
							svg.setAttribute("viewBox", "0 0 16 16");
							
							let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
							path.setAttribute("d", "M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z");
							path.setAttribute("fill", "#000000");
							svg.appendChild(path);

							path = document.createElementNS("http://www.w3.org/2000/svg", "path");
							path.setAttribute("d", "M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708");
							path.setAttribute("fill", "#ff0000");
							svg.appendChild(path);

							entry.appendChild(svg);

							let spanBounds = document.createElement("span");
							spanBounds.innerHTML = "No data";
							entry.appendChild(spanBounds);
						
							
						}
						
						document.getElementById("legend").appendChild(entry);
					}
				}
			);

			{% block after_elevation_selection %}{% endblock %}
			
			document.getElementById("images-management-add").addEventListener(
				"click",
				() => {
					let now = new Date();
					let oneHourBefore = new Date(now); oneHourBefore.setHours(now.getHours()-1);
					document.getElementById("select-start-date-add-images").value = oneHourBefore.toISOString().slice(0, 16);
					document.getElementById("select-end-date-add-images").value = now.toISOString().slice(0, 16);
					document.querySelectorAll("#modal-images-add input[type=checkbox]").forEach((node) => { node.checked = true; });
				}
			);

			document.getElementById("images-management-add-confirm").addEventListener(
				"click",
				async () => {
					document.getElementById("spinner-confirm-add").classList.remove("d-none");

					await fetch(`/add/${location.pathname.split('/').at(-1)}`, {
						method: "POST",
						body: JSON.stringify({
							jabbeke: document.getElementById("select-jabbeke").checked,
							wideumont: document.getElementById("select-wideumont").checked,
							start_date: document.getElementById("select-start-date-add-images").value,
							end_date: document.getElementById("select-end-date-add-images").value,
							dbz: document.getElementById("select-dbz").checked,
							dbuz: document.getElementById("select-dbuz").checked,
							phidp: document.getElementById("select-phidp").checked,
							uphidp: document.getElementById("select-uphidp").checked,
							rhohv: document.getElementById("select-rhohv").checked,
							zdr: document.getElementById("select-zdr").checked,
							kdp: document.getElementById("select-kdp").checked,
							v: document.getElementById("select-v").checked
						}),
						headers: {"Content-Type": "application/json"}
					});

					location.reload();
				}
			);

			{% block opacity_script %}{% endblock %}
			
			fetch(`/intervals/${location.pathname.split('/').at(-1)}`).then((res) => res.json()).then((json) => {
				for (const [folder, interval] of Object.entries(json)) {
					document.getElementById("select-interval").add(new Option(interval, folder))
				}
				
				document.getElementById("select-interval").dispatchEvent(new InputEvent("input"));
			});

			fetch(`/dir-size/${location.pathname.split('/').at(-1)}`).then((res) => res.text()).then((text) => {
				document.getElementById("dir-size-display").innerHTML = `Folder size : ${text}`;
			});
		</script>
	</body>
</html>
